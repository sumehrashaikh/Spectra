name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run test suite
        # Run from the repository root so `prototype` imports resolve exactly
        # like an installed package (no sys.path leakage).
        run: python -m pytest -q --tb=short

  packaging:
    name: Packaging smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and install into a clean venv
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m venv /tmp/spectra-venv
          /tmp/spectra-venv/bin/pip install dist/*.whl

      - name: Verify CLI entry point
        run: |
          /tmp/spectra-venv/bin/spectra version
          /tmp/spectra-venv/bin/spectra validate

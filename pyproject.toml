[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spectra_v2"
version = "2.1.0"
description = "Spectra - RF/signal analysis platform (engineering prototype; synthetic-data validated)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "PySide6>=6.5.0",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.2.0"]
# Only needed to re-run the one-time Keras-pickle conversion tool
# (prototype.ml.tools.convert_keras_pickle); runtime inference is NumPy-only.
ml-tools = ["h5py>=3.8"]
docs = ["python-docx>=0.8.11"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
spectra = "prototype.cli:main"

[tool.setuptools.packages.find]
include = ["prototype*"]
exclude = ["prototype.tests*", "prototype.data*"]

[tool.pytest.ini_options]
testpaths = ["prototype/tests"]
python_files = ["test_*.py"]
